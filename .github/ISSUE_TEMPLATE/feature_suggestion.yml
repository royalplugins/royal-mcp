name: Feature suggestion
description: Suggest a new tool, capability, or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature. Before filling in the form, please read how feature suggestions are handled:

        - We log every suggestion. Nothing gets ignored.
        - Suggestions are considered against current priorities, not on a fixed timeline.
        - **Ship dates are not quoted in individual threads.** When something ships, it appears in the changelog and a comment on this issue closes the loop.
        - Suggestions that align with current work move faster. Larger requests, plugin-specific adapters, or ideas that require new architecture may sit for a while.

        None of this means your idea won't be built. It just means the response here will be honest about timing rather than optimistic.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or capability gap you're hitting. What are you trying to do that Royal MCP currently doesn't let you do?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What tool, parameter, or behavior would solve the problem? A specific proposal is easier to evaluate than an abstract wish.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case / example prompt
      description: Give a concrete example of an AI prompt or workflow this would enable.
      placeholder: |
        e.g. "Update the alt text on every image with filename containing 'hero-' to 'Studio hero photo'."
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Roughly, what area does this touch?
      options:
        - Core WordPress primitives (posts, pages, users, media, options, terms, etc.)
        - WooCommerce
        - SEO plugins (Yoast, Rank Math, AIOSEO, SEObolt)
        - Page builders (Elementor, Divi, Gutenberg, Beaver, Bricks, other)
        - Individual third-party plugin adapter
        - OAuth / authentication / sessions
        - Admin UI / settings / diagnostics
        - Other
    validations:
      required: true

  - type: checkboxes
    id: acknowledgments
    attributes:
      label: Before submitting
      options:
        - label: I understand feature suggestions are considered against current priorities and ship dates are not quoted in individual issue threads.
          required: true
        - label: I've searched existing issues (open and closed) and this isn't already tracked.
          required: true
